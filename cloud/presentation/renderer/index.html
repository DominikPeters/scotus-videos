<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SCOTUS oral argument</title>

    <style>
        @font-face {
            font-family: "myriad-pro";
            src: url("myriadpro/MYRIADPRO-REGULAR.OTF") format("opentype");
            font-weight: 400;
        }
        @font-face {
            font-family: "myriad-pro";
            src: url("myriadpro/MYRIADPRO-SEMIBOLD.OTF") format("opentype");
            font-weight: 600;
        }
        @font-face {
            font-family: "myriad-pro";
            src: url("myriadpro/MYRIADPRO-BOLD.OTF") format("opentype");
            font-weight: 700;
        }
        @font-face {
            font-family: "myriad-pro";
            src: url("myriadpro/MyriadPro-Light.otf") format("opentype");
            font-weight: 300;
        }
        @font-face {
            font-family: "myriad-pro";
            src: url("myriadpro/Myriad Pro Italic.ttf") format("truetype");
            font-weight: 400;
            font-style: italic;
        }
        
        body {
            background-color: #eee;
            font-family: myriad-pro, "Myriad Pro", sans-serif;
            font-size: 20px;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            height: 100vh;
            visibility: hidden;
        }

        div.frame {
            width: 1920px;
            height: 1080px;
            background-color: hsl(43, 45%, 99%);
            border: 1px solid #ccc;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.1);
            /* transform: scale(0.75) translate(-14%, -14%); */
            overflow: hidden;
        }

        div.header {
            background-color: hsl(43, 45%, 94%);
            z-index: -2;
        }

        div.title {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: top;
            height: 100px;
            padding: 20px;
            padding-top: 10px;
        }

        div.title h1 {
            font-size: 60px;
            font-weight: 600;
            margin: 0;
            white-space: nowrap;
        }

        div.title p.subtitle {
            font-size: 30px;
            font-weight: 400;
            margin: 0;
            margin-top: 3px;
        }

        span.docket-number {
            font-weight: 500;
        }

        div.bench {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }

        div.bench figure {
            display: flex;
            flex-direction: column;
            width: 248px;
            margin: 0 -20px;
            z-index: 2;
        }

        div.bench figcaption {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.6), 0 0 4px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 1), 0 0 1px rgba(0, 0, 0, 1);
            margin-top: -23px;
            font-size: 18px;
        }

        div.bench figure.active-speaker {
            z-index: 1;
        }

        div.bench figure.active-speaker img {
            background-color: rgb(137, 195, 246); 
            box-shadow: inset 0 0 100px rgb(255, 255, 255);
            border-top-left-radius: 250px;
            border-top-right-radius: 250px;
        }

        div.main {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: start;
            position: relative;
        }

        div.conversation {
            display: flex;
            flex-direction: column;
            align-items: start;
            padding-top: 20px;
            padding-left: 20px;
            gap: 20px;
            width: 790px;
            background-color: hsl(43, 45%, 82%);
            height: 100vh;
        }

        div.conversation div.advocate {
            display: flex;
            flex-direction: row;
            align-items: end;
            gap: 0px;
        }

        div.conversation div.advocate img {
            box-sizing: border-box;
            object-fit: cover;
        }

        div.conversation div.advocate.active-speaker img {
            border: 3px solid hsl(208, 86%, 80%);
            box-shadow: 0 0 12px hsl(208, 86%, 84%), 0 0 6px hsl(208, 86%, 84%), 0 0 3px rgb(24, 61, 93);
        }

        div.conversation div.advocate div.advocate-text {
            width: 500px;
        }

        div.conversation div.advocate p.advocate-name {
            margin: 0;
        }

        div.conversation div.advocate p.advocate-name > span {
            font-size: 40px;
            font-weight: 600;
            border-radius: 6px;
            padding: 6px;
            padding-bottom: 1px;
        }

        div.conversation div.advocate.active-speaker p.advocate-name > span {
            background-color: hsl(208, 86%, 84%); 
            color: hsl(208, 86%, 10%); 
            box-shadow: inset 0 0 12px rgb(223, 240, 255), inset 0 0 3px rgb(24, 61, 93);
        }

        div.conversation div.advocate p.advocate-description {
            font-size: 28px;
            font-weight: 500;
            padding: 0 6px;
            margin: 0;
        }

        div.conversation div.justice-speakers {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        div.conversation div.justice-speakers div.interaction {
            position: relative;
        }

        div.conversation div.justice-speakers div.interaction div.interaction-number {
            position: absolute;
            bottom: 4px;
            left: 4px;
            color: hsl(0, 0%, 100%);
            text-shadow: 0 0 1px hsl(0, 0%, 0%), 0 0 2px hsl(0, 0%, 0%), 0 0 3px hsl(0, 0%, 0%), 0 0 5px hsl(0, 0%, 0%);
            font-weight: 600;
            width: 30px;
            height: 20px;
            border-radius: 20%;
            text-align: center;
        }

        div.conversation div.justice-speakers div.interaction img {
            display: block;
            width: 100px;
            height: 140px;
            background-color: #f0f0f0;
            object-fit: cover;
            filter: saturate(0.6) contrast(0.25) brightness(1.6);
            box-sizing: border-box;
            border: 1px solid hsl(43, 45%, 40%);
        }

        div.conversation div.justice-speakers.small div.interaction img {
            width: calc(100px * 0.85);
            height: calc(140px * 0.85);
        }

        div.conversation div.justice-speakers.very-small div.interaction img {
            width: calc(100px * 0.66);
            height: calc(140px * 0.66);
        }

        div.conversation div.justice-speakers.very-small div.interaction div.interaction-number {
            bottom: 3px;
            left: 3px;
            width: 20px;
            height: 15px;
            font-size: 72%;
        }

        div.conversation div.justice-speakers div.interaction.active-speaker img {
            --percent: 0%;
            background-color: hsl(43, 75%, 74%);
            background: linear-gradient(90deg, hsl(43, 75%, 72%) var(--percent), hsl(43, 75%, 97%) var(--percent));
            box-shadow: inset 0 0 3px hsl(43, 75%, 30%);
            border: 2px solid hsl(43, 100%, 50%);
            filter: saturate(1);
        }

        div.conversation div.justice-speakers div.interaction.active-speaker div.interaction-number {
            background-color: hsl(43, 100%, 40%);
            color: hsl(43, 100%, 10%);
            text-shadow: none;
        }

        div.transcript {
            width: 1160px;
            height: 786px;
            background-color: hsl(43, 45%, 96%);
            border-left: 2px solid #ccc;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: scroll;
        }

        div.transcript div.turn {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 17px;
        }

        div.transcript div.turn div.turn-speaker {
            width: 60px;
        }

        div.transcript div.turn div.turn-speaker img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background: hsl(43, 60%, 80%);
            background: radial-gradient(circle, hsl(43, 60%, 85%) 0%, hsl(43, 60%, 75%) 70%)
        }

        div.transcript div.turn div.text-blocks div.speaker-label {
            padding-left: 10px;
            color: #444;
            font-size: 88%;
            margin-top: -8px;
            margin-bottom: -1px;
        }

        div.transcript div.turn:first-child div.text-blocks div.speaker-label {
            margin-top: 0;
        }

        div.transcript div.turn div.text-blocks p {
            margin-top: 0;
            margin-bottom: 7px;
            font-size: 28px;
            background-color: hsl(0, 0%, 86%);
            padding: 10px 15px;
            padding-bottom: 7px;
            border-radius: 25px;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            box-sizing: border-box;
        }

        div.transcript div.turn div.text-blocks p:first-of-type {
            border-top-left-radius: 25px;
        }
        div.transcript div.turn div.text-blocks p:last-child {
            border-bottom-left-radius: 25px;
        }

        div.transcript div.turn div.text-blocks.text-blocks-justice p {
            background-color: hsl(43, 60%, 85%);
        }

        div.transcript div.turn div.text-blocks p.current-text {
            background-color: hsl(208, 30%, 92%); 
            border: 4px solid hsl(208, 86%, 70%);
            padding: 6px 11px;
            padding-bottom: 3px;
        }

        /* phrases a card refers to; --reference-new / --reference-old fade the marks with the card */
        div.transcript {
            --reference-new: 0;
            --reference-old: 0;
        }

        div.transcript span.card-reference.new {
            --a: var(--reference-new);
        }

        div.transcript span.card-reference.old {
            --a: var(--reference-old);
        }

        /* dotted underline on a slightly brighter patch of the bubble (works on grey, beige and blue bubbles) */
        div.transcript span.card-reference {
            text-decoration: underline dotted;
            text-decoration-thickness: 3px;
            text-underline-offset: 5px;
            text-decoration-color: hsl(43 80% 38% / var(--a));
            background-color: rgb(255 255 255 / calc(0.6 * var(--a)));
            border-radius: 4px;
            padding: 0 3px;
            margin: 0 -3px;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        div.transcript div.turn div.text-blocks.text-blocks-justice p.current-text {
            background-color: hsl(43, 36%, 85%); 
        }

        div.splash {
            width: 1920px;
            padding: 10px 120px;
            height: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        div.splash h2 {
            text-align: center;
            font-size: 40px;
            margin-bottom: -20px;
            margin-top: 12px;
        }

        div.splash div.oyez-text {
            font-size: 33px;
            line-height: 1.3;
        }

        div.splash div.oyez-text a {
            color: black;
            text-decoration: none;
        }

        div.splash div.acknowledgement {
            font-size: 25px;
            text-align: center;
        }

        div.subscribe-suggestion {
            position: absolute;
            bottom: 40px;
            left: 140px;
            background: #ffffff;
            font-size: 25px;
            padding: 13px 10px 0 10px;
            border: 3px solid hsl(346, 100%, 30%),;
            box-shadow: 0.5px 0.5px 5px hsl(346, 20%, 40%);
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        /* ---- Quote mockup additions ---- */

        /* compact header: used during the argument (splash and thumbnail keep the old header) */
        div.frame.compact div.title {
            height: 72px;
            padding-bottom: 8px;
        }

        div.frame.compact p.subtitle {
            display: none;
        }

        div.frame.compact img.seal {
            height: 104px;
            margin-top: -6px;
            margin-right: -12px;
        }

        div.frame.compact div.bench {
            justify-content: flex-start;
            margin-left: -44px;
        }

        div.frame.compact div.bench figure {
            margin: 0 -20px;
        }

        /* fixed box, so the header height does not depend on image loading */
        div.frame.compact div.bench figure img {
            aspect-ratio: 3 / 2;
        }

        div.frame.compact div.bench figure:first-child {
            margin-left: 0;
        }

        div.frame.compact div.conversation,
        div.frame.compact div.transcript {
            height: var(--main-height);
        }

        div.frame.compact div.conversation {
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* squeeze: --q goes from 0 (no card) to 1 (card fully shown);
           --squeeze (0..1) limits how far the sidebar shrinks for short cards;
           --tile is the section's tile scale (set by sizeInteractionTiles), --cols its column count */
        div.conversation {
            --q: 0;
            --squeeze: 1;
            --sq: calc(var(--q) * var(--squeeze));
            --tile: 1;
        }

        div.frame.compact div.conversation div.advocate img {
            width: calc(245px - 85px * var(--sq));
            height: calc(245px - 85px * var(--sq));
        }

        /* tiles keep their columns and become shorter and a little narrower (about square) */
        div.frame.compact div.conversation div.justice-speakers div.interaction img {
            width: calc(100px * var(--tile) * (1 - 0.2 * var(--sq)));
            height: calc(140px * var(--tile) * (1 - 0.43 * var(--sq)));
        }

        div.frame.compact div.conversation div.justice-speakers.fixed-columns {
            width: calc(var(--cols) * 100px * var(--tile) * (1 - 0.2 * var(--sq)) + (var(--cols) - 1) * 5px + 1px);
        }

        /* turn numbers scale with their tiles */
        div.frame.compact div.conversation div.justice-speakers div.interaction div.interaction-number {
            --f: calc(var(--tile) * (1 - 0.2 * var(--sq)));
            bottom: calc(4px * var(--f));
            left: calc(4px * var(--f));
            width: calc(30px * var(--f));
            height: calc(20px * var(--f));
            font-size: calc(20px * var(--f));
        }

        /* quote card: label + bubble + source, like a transcript turn */
        div.quote-card {
            display: none;
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 18px;
            height: var(--card-height, 400px);
            box-sizing: border-box;
            flex-direction: column;
        }

        div.frame.compact div.quote-card.visible {
            display: flex;
        }

        /* previous card, underneath the incoming one during a swap */
        div.quote-card#quote-card-under {
            transform-origin: 50% 0;
        }

        /* opaque, so a card stacked on top hides the one underneath (label and source rows included) */
        div.quote-card {
            background-color: hsl(43, 45%, 82%);
        }

        div.quote-card div.quote-label:has(span.quote-kind:empty):has(span.quote-heading:empty) {
            display: none;
        }

        div.quote-card div.quote-label {
            padding-left: 10px;
            margin-bottom: 4px;
            color: #333;
            font-size: 22px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        div.quote-card span.quote-kind {
            color: #555;
        }

        div.quote-card span.quote-kind::after {
            content: " \00b7";
        }

        div.quote-card span.quote-kind:has(+ span.quote-heading:empty)::after {
            content: "";
        }

        div.quote-card span.quote-heading {
            font-weight: 600;
        }

        div.quote-card div.quote-body {
            flex: 1;
            overflow: hidden;
            padding: 12px 18px 10px 18px;
            background-color: hsl(43, 45%, 96%);
            border-radius: 25px;
            font-size: 23px;
            line-height: 1.3;
            color: #222;
        }

        div.quote-card div.quote-body span.context {
            color: #777;
        }

        div.quote-card div.quote-body mark {
            background-color: hsl(43, 75%, 78%);
            color: #111;
            border-radius: 3px;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        div.quote-card div.quote-body b {
            font-weight: 600;
        }

        div.quote-card div.quote-body div.case-name {
            font-size: 110%;
            font-weight: 600;
            line-height: 1.2;
        }

        div.quote-card div.quote-body div.case-details {
            font-size: 85%;
            color: #666;
            margin: 2px 0 6px 0;
        }

        /* glossary */
        div.quote-card div.glossary-term {
            font-size: 110%;
            margin-bottom: 4px;
        }

        div.quote-card div.glossary-term b {
            font-weight: 600;
        }

        div.quote-card span.glossary-expansion {
            color: #444;
        }

        /* statutes side by side */
        div.quote-card div.compare {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        div.quote-card div.compare-column + div.compare-column {
            border-left: 1px solid hsl(43, 30%, 82%);
            padding-left: 18px;
        }

        div.quote-card div.compare-title {
            font-weight: 600;
        }

        div.quote-card div.compare-cite {
            font-size: 80%;
            color: #666;
            margin-bottom: 6px;
        }

        div.quote-card div.compare-text {
            font-size: 95%;
        }

        /* timeline */
        div.quote-card div.timeline {
            display: flex;
            position: relative;
            padding-top: 4px;
        }

        div.quote-card div.timeline-event {
            flex: 1;
            text-align: center;
            position: relative;
        }

        div.quote-card div.timeline-date,
        div.quote-card div.timeline-label {
            padding: 0 3px;
        }

        /* the line runs through the middle of each event's dot row */
        div.quote-card div.timeline-track {
            position: relative;
            height: 18px;
            margin: 6px 0;
        }

        div.quote-card div.timeline-track::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: calc(50% - 1px);
            border-top: 2px solid hsl(43, 30%, 70%);
        }

        div.quote-card div.timeline-event:first-child div.timeline-track::before {
            left: 50%;
        }

        div.quote-card div.timeline-event:last-child div.timeline-track::before {
            right: 50%;
        }

        div.quote-card div.timeline-event.after-gap div.timeline-track::before {
            border-top-style: dashed;
        }

        div.quote-card div.timeline-date {
            font-size: 72%;
            font-weight: 600;
            color: #555;
            white-space: nowrap;
            height: 1.25em;
        }

        /* dots are centred on the track, so the line always crosses them in the middle */
        div.quote-card div.timeline-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: hsl(43, 30%, 62%);
        }

        div.quote-card div.timeline-label {
            font-size: 68%;
            line-height: 1.2;
            color: #444;
        }

        div.quote-card div.timeline-event.current div.timeline-dot {
            width: 18px;
            height: 18px;
            background: hsl(43, 90%, 55%);
            box-shadow: 0 0 0 2px hsl(43, 75%, 30%);
        }

        div.quote-card div.timeline-event.current div.timeline-label,
        div.quote-card div.timeline-event.current div.timeline-date {
            color: #111;
            font-weight: 600;
        }

        /* record exhibit */
        div.quote-card img.exhibit {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #d8d4c8;
            border-radius: 4px;
        }

        /* circuit map */
        div.quote-card div.map-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        div.quote-card div.map-svg {
            flex: 0 0 58%;
        }

        div.quote-card div.map-svg svg {
            display: block;
            width: 100%;
            height: auto;
        }

        div.quote-card div.map-legend {
            font-size: 72%;
            line-height: 1.25;
        }

        div.quote-card div.map-legend-item {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        div.quote-card div.map-legend-item b {
            font-weight: 600;
        }

        div.quote-card span.swatch {
            flex: 0 0 16px;
            height: 16px;
            border-radius: 3px;
            margin-top: 2px;
        }

        div.quote-card span.swatch.below {
            border: 2.5px solid #222;
            box-sizing: border-box;
        }

        div.quote-card div.quote-body.quote-only mark {
            background-color: transparent;
        }

        div.quote-card div.quote-body p.footnote {
            font-size: 85%;
            margin: 8px 0 0 0;
            color: #777;
        }

        div.quote-card div.quote-source {
            padding: 9px 10px 0 10px;
            font-size: 17px;
            color: #444;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* interactive preview controls (never shown when rendering frames) */
        div.mockup-controls {
            display: none;
            position: fixed;
            left: 8px;
            bottom: 8px;
            z-index: 10;
            gap: 8px;
            align-items: center;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 16px;
        }

        div.mockup-controls button {
            font: inherit;
            font-size: 15px;
            padding: 2px 8px;
        }
    </style>

</head>

<body>
    <div class="frame">
        <div class="header">
            <div class="title">
                <div class="title-text">
                    <h1><span class="docket-number" id="docket-number">[17-1104]</span> <span id="case-name">Air and Liquid Systems Corp. v. Devries</span></h1>
                    <p class="subtitle" id="subtitle">Argued on Oct 10, 2018. Decided on Mar 19, 2019.</p>
                </div>
                <img class="seal" src="seal.svg" height="130">
            </div>
            <div class="bench" id="bench">
            </div>
        </div>
        <div class="main">
            <div class="splash" id="splash">
                <div id="case-info">
                    <h2>Facts of the case</h2>
                    <div class="oyez-text" id="facts-of-the-case"></div>
                    <h2>Question</h2>
                    <div class="oyez-text" id="question"></div>
                </div>
                <div class="acknowledgement">Case information and transcript taken from the Oyez project (oyez.org), provided under a CC-BY-NC license.</div>
            </div>
            <div class="conversation" id="conversation">
                <div class="advocate" id="advocate">
                    <img id="advocate-img" src="" height="245" width="245" style="margin-right: 10px;">
                    <div class="advocate-text">
                        <p class="advocate-name" id="advocate-name"></p>
                        <p class="advocate-description" id="advocate-description"></p>
                    </div>
                </div>
                <div class="justice-speakers" id="justice-interactions">
                </div>
                <div class="quote-card" id="quote-card">
                    <div class="quote-label"><span class="quote-kind" id="quote-kind"></span> <span class="quote-heading" id="quote-heading"></span></div>
                    <div class="quote-body" id="quote-body"></div>
                    <div class="quote-source" id="quote-source"></div>
                </div>
            </div>
            <div class="transcript" id="transcript">
            </div>
            <div class="subscribe-suggestion">
                To support this channel, you can:<br>
                <img src="subscribe.png" width="500" style="margin-top: 4px;">
            </div>
